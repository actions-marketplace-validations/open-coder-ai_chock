# Frozen fixture: exercises the emitters for a script-backed gate (git-hook, ci-gate,
# pre-tool-use write fragment, stop, ambient-rule). Do not "improve" this policy -- its only
# job is to be compiled identically by every patch release. See test_emitter_stability.py.
id: stability-script
name: "Emitter Stability Script Gate"
version: "0.0.1"
description: >
  Fixture policy for the emitter-stability guarantee. A gate whose check is a script the
  policy ships, so every surface a write-path gate reaches has output worth comparing
  byte-for-byte across releases.
artifact: hook
enforcement: block
effects:
- read_only
approval:
  required: false

hook:
  gate:
    kind: script
    "on": [commit, tool_use]
    action: block
    message: >
      Refused by the fixture's own script.
    params:
      script: stability-script-gate.py

provenance:
  author: "chock-core"
  created_at: "2026-09-22T00:00:00Z"
  updated_at: "2026-09-22T00:00:00Z"
  source_repo: "https://github.com/open-coder-ai/chock"
  license: "Apache-2.0"
  trust_tier: "community"

lifecycle:
  status: draft
  reviewed_by:
    - "chock-core"

security:
  content_instructions: never-obey

changelog:
- version: 0.0.1
  date: '2026-09-22'
  changes:
  - "Frozen emitter-stability fixture for a script-backed gate."
